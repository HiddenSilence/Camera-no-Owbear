<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Câmera OBS — transmissão</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      #root { position: fixed; inset: 0; pointer-events: none; background: transparent; }
      #camera { position: absolute; left: 50%; top: 50%; width: 320px; height: 180px; object-fit: cover; transform: translate(-50%, -50%); transform-origin: center center; border: 6px solid rgba(255,255,255,.94); border-radius: 10px; box-shadow: 0 0 0 2px rgba(0,0,0,.8), 0 10px 30px rgba(0,0,0,.45); background: #111; opacity: 0; }
      #status { position: fixed; left: 16px; bottom: 16px; max-width: min(520px, calc(100vw - 32px)); padding: 7px 10px; border-radius: 6px; background: rgba(0,0,0,.72); color: #fff; font: 12px/1.35 system-ui, sans-serif; opacity: 0; transition: opacity .15s; }
      #status.error { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root">
      <video id="camera" autoplay playsinline muted></video>
      <div id="status"></div>
    </div>
    <script type="module" src="/src/overlay.js"></script>
  </body>
</html>
