<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>OBS Cam</title>
  <style>
    body {
      margin: 0;
      padding: 6px;
      background-color: #121214;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
      font-family: sans-serif;
      overflow: hidden;
    }
    .moldura {
      width: 100%;
      height: 80%;
      border: 3px solid #ff4500;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(255, 69, 0, 0.7);
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    button {
      margin-top: 8px;
      padding: 6px 14px;
      background-color: #ff4500;
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
  <script src="https://unpkg.com"></script>
</head>
<body>
  <div class="moldura">
    <video id="video-webcam" autoplay playsinline muted></video>
  </div>
  <button id="btn-conectar">Ligar Câmera</button>
  <script src="app.js"></script>
</body>
</html>
