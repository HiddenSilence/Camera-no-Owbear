<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle da Câmera</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      background-color: #121214;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      background-color: #ff4500;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #ff5714;
    }
    #canvas-oculto {
      display: none;
    }
  </style>
  <script src="https://unpkg.com"></script>
</head>
<body>

  <button id="btn-iniciar">Criar Moldura no Mapa</button>
  
  <!-- Elementos invisíveis que vão processar o vídeo e mandar pro mapa -->
  <video id="video-origem" autoplay playsinline muted style="display:none;"></video>
  <canvas id="canvas-oculto" width="640" height="480"></canvas>

  <script src="app.js"></script>
</body>
</html>
